name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      # secret scan, lint, typecheck, unit/route/safety tests, offline scenario QA, build, browser tests.
      # Needs no .env.local or data/*.db: tests use scratch data and routes read both at request time
      - name: Release gate
        run: npm run verify
      - name: Browser test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
